name: Backend CI

on:
  push:
    branches: [development, stage, main]
  pull_request:
    branches: [development, stage, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore HotelBooking.sln

      - name: Build solution
        run: dotnet build HotelBooking.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test HotelBooking.sln --configuration Release --no-build
